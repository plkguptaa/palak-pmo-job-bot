name: Automated Job Scraper

on:
  schedule:
    # Runs every 6 hours (0th minute of every 6th hour)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Job Scraper Script
        run: python main.py

      - name: Commit and Push Updated Jobs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update jobs.csv every 6 hours [skip ci]" && git push)
